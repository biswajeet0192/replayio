[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replayio"
version = "0.1.0"
description = "Record and replay backend traffic (HTTP + SQL) with zero code changes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Biswajeet Behera" }]
keywords = [
    "replay", "recording", "http", "sql", "debugging", "testing",
    "observability", "backend", "distributed-systems", "middleware",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Distributed Computing",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
sqlalchemy = ["sqlalchemy>=2.0"]
yaml = ["PyYAML>=6.0"]
all = ["httpx>=0.24", "sqlalchemy>=2.0", "PyYAML>=6.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.24",
    "sqlalchemy>=2.0",
    "PyYAML>=6.0",
    "flask>=2.3",
]

[project.urls]
Homepage = "https://github.com/biswajeet0192/replayio"
Repository = "https://github.com/biswajeet0192/replayio"
Issues = "https://github.com/biswajeet0192/replayio/issues"
Documentation = "https://github.com/biswajeet0192/replayio#readme"

[project.scripts]
replayio = "replayio.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
replayio = ["py.typed"]
